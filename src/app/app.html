<div class="wrap">
  <div class="bg-shapes" aria-hidden="true"></div>
  <div class="container">
    <header>
      <button class="hamburger" [class.open]="menuOpen" (click)="toggleMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="menu nav-menu" [class.open]="menuOpen">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
        <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Projects</a>
        <a routerLink="/testimonials" routerLinkActive="active" (click)="closeMenu()">Testimonials</a>
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
      </div>
      <div class="logo">
        <img src="images/logo.png" alt="logo" class="logo-image">
      </div>
      <div class="menu social-menu" [class.open]="menuOpen">
        <a href="https://github.com/adam-gainus" aria-label="GitHub" target="_blank" rel="noopener noreferrer">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="https://www.linkedin.com/in/adam-gainus-a624a9186" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer">
          <i class="fa-brands fa-linkedin"></i>
        </a>
      </div>
    </header>
    <router-outlet></router-outlet>
    <footer>
      <p>This web is built on Angular.</p>
      <p>&copy; 2026 Adam Gainus</p>
    </footer>
  </div>

</div>
